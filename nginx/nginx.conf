upstream django {
  server django:8000;
}

upstream react {
  server react:5173;
}

server {
  listen 80;

  # This will be called from backend\simplecrud\views.py
  location @webapp {
    internal;

    # Production example:
    # alias /app/dist/;
    # try_files $uri /protectedReact/index.html;

    # Web Sockets
    #
    # WS DISABLED SINCE WE WILL BE 
    # CONNECTING DIRECTLY TO THE HMR PORT
    # SPECIFYING IT IN VITE
    # 
    # proxy_http_version 1.1;
    # proxy_set_header Upgrade $http_upgrade;
    # proxy_set_header Connection "upgrade";

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $server_name;

    proxy_redirect off;
    proxy_pass http://react$upstream_http_x_accel_redirect_location;
  }
  

  # Redirect any other requests to the Django server
  location / {

    # Can't take more than 5 minutes to respond
    proxy_read_timeout 300s;
    proxy_pass http://django;
    proxy_redirect default;
    
    # WebSockets
    # Not needed unless you have WebSocket connections in Django (ASGI)
    # proxy_http_version 1.1;
    # proxy_set_header Upgrade $http_upgrade;
    # proxy_set_header Connection "upgrade";

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $server_name;
  }
}